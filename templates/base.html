<!DOCTYPE HTML>
<html style="font-size: 20px">
<head>
    <link rel="shortcut icon" href="https://cdn.jsdelivr.cn/npm/@bootcss/v3.bootcss.com@1.0.48/favicon.ico">
    <title>mention</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta name="viewport" content="width=device-width, user-scalable=no">
    <style>
        input {
            font-size: 3vw;
            height: 4vw;
            line-height: 4vw;
            margin-left: 1vw;
            margin-top: 1vw;
            width: 40vw;
            vertical-align: middle
        }

        .btn {
            height: 3vw;
            margin-left: 1vw;
            margin-top: 1vw;
            width: 8vw;
            color: #333;
            border-color: #ccc;
            display: inline-block;
            margin-bottom: 0;
            font-weight: 300;
            text-align: center;
            white-space: nowrap;
            vertical-align: middle;
            -ms-touch-action: manipulation;
            touch-action: manipulation;
            cursor: pointer;
            background-image: none;
            padding: 6px 12px;
            font-size: 8px;
            line-height: 1;
            border-radius: 2px;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none
        }

    </style>
</head>
<body>
{% block main %}
{% endblock %}
</body>
</html>
