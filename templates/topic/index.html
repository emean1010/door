{% extends "base.html" %}
{% block main %}
<form action="/topic/add" method="POST">
    <input type="text" name="content">
    <button type="submit">add</button>
</form>

<div>
    {% for t in topics %}
    <h3>{{t.content}}</h3>
    <a href="/topic/{{t.id}}">update</a>
    <a href="/topic/delete/{{t.id}}">delete</a>
    {% endfor %}
</div>
{% endblock %}
